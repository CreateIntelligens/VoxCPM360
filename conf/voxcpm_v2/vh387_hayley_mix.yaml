# VH-387 B 版：Hayley 36 句（×5）混 400 句 tai8 lora_novel replay。
# 純 40 句（vh387_hayley_orig.yaml）可能讓 LoRA 把所有參考音都拉向 Hayley／
# CosyVoice 的合成音色、或一般句子退步；replay 讓模型學新字詞時不忘舊能力。
# 文本同樣用「送進TTS的文字」華語原文。val 為不進訓練的 Hayley 4 句 + tai8 20 句。
# val loss 在台語上不可信（見 model_registry.json），checkpoint 靠實聽挑。
pretrained_path: /app/checkpoints/ft-mixed-lr2e5-avgE-e12run-0820
train_manifest: /app/dataset/vh387/manifests/train_mix.jsonl
val_manifest: /app/dataset/vh387/manifests/val_mix.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 2
num_workers: 2
# 580 句 / grad_accum 2 = 每 epoch 290 step，5 epoch 約 1450 step；Hayley 每句共見 25 次。
num_epochs: 5
valid_per_epoch: 1
save_per_epoch: 1
log_interval: 20
learning_rate: 0.00005
weight_decay: 0.01
warmup_steps: 50
max_batch_tokens: 4096
max_grad_norm: 1.0
save_path: /app/checkpoints/vh387-hayley-mix
tensorboard: /app/checkpoints/vh387-hayley-mix/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
# 資料只有 5 分鐘，r 從 lora_novel 的 32 降到 16。
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 16
  alpha: 16
  dropout: 0.05
