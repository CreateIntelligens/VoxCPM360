# E4 tai8 有效 batch 加倍
#
# grad_accum 8 -> 16（有效 batch 128 -> 256）。較大 batch 梯度更穩，
# 可能延後過擬合點。LR 同步微調至 1.4e-5（約 sqrt(2) 倍）。
