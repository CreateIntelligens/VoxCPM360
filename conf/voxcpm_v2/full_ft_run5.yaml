# 全參數微調調整顯存策略：單卡 batch_size 改為 4，grad_accum 改為 8
# 有效 batch = 4 × 8 × 4 (GPUs) = 128，維持與 run2/run4 相同的有效 batch 基準
batch_size: 4
grad_accum_steps: 8
num_workers: 8

# max_sample_len = 8192 // 4 = 2048；tai8 max token = 630，完全不丟棄樣本
max_batch_tokens: 8192

# 222383 ÷ 128 ≈ 1738 步/epoch；7000 步 ≈ 4.03 epoch
num_iters: 7000
max_steps: 7000
log_interval: 50
valid_interval: 500

# ⚠️ 全參微調單個 Checkpoint 約 4~5 GB，將 save_interval 設為 1000（產生約 7 個 ckpt ≈ 30 GB）
save_interval: 1000

# ★ 全參數微調關鍵：學習率必須大幅調低（預設 1e-5），避免破壞預訓練權重
learning_rate: 0.00001
weight_decay: 0.01
warmup_steps: 500
max_grad_norm: 1.0

