# E5 混合資料基準（3 epoch）
#
# mixed 28.8 萬句，是三組資料量最大者。同 E1 設定以檢驗資料量優勢。
# 注意 val 集與 E1 不同，需用 eval_ckpt.py 對齊後才可比較。
#
# 以 epoch 為單位：已完成三輪的最佳點都在 epoch 1.7~2.5，故跑 3 epoch
# 涵蓋谷底並留出過擬合觀察區。每 epoch 驗證/存檔 8 次，配合 best 追蹤。
