# A：縮短排程 + 密集驗證
#
# 三組全參微調都在 step 1,500~4,000 見頂後單調過擬合，卻都跑滿 7,000。
# LR 排程綁定 max_steps，縮到 5,000 可讓 cosine 曲線貼合有效區間，
# 谷底本身可能就比原設定更低——這是唯一可能改善品質的改動。
#
# 共同基礎：full_ft_tai8.yaml（batch 4 x grad_accum 8 = 有效 128）
# valid_interval 與 save_interval 對齊 250，配合 best checkpoint 追蹤，
# 谷底不會落在兩個 save_interval 之間而取不到。
pretrained_path: /mnt/home/csl426-aicr-ae5f63/.cache/huggingface/hub/models--openbmb--VoxCPM2/snapshots/bffb3df5a29440629464e5e839f4d214c8714c3d

train_manifest: /mnt/home/csl426-aicr-ae5f63/dataset202607_1/tai8/manifests/voxcpm2_abs/train.jsonl
val_manifest: /mnt/home/csl426-aicr-ae5f63/dataset202607_1/tai8/manifests/voxcpm2_abs/val_seen.jsonl
sample_rate: 16000
out_sample_rate: 48000

batch_size: 4
grad_accum_steps: 8
num_workers: 8
max_batch_tokens: 8192

num_iters: 5000
max_steps: 5000
log_interval: 50
valid_interval: 250
save_interval: 250

learning_rate: 0.00001
weight_decay: 0.01
warmup_steps: 500
max_grad_norm: 1.0

save_path: /app/checkpoints/ft_tai8_A_dense
tensorboard: /app/checkpoints/ft_tai8_A_dense/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
