# 記憶體探針：從 ft-mixed-*-0820 起步的 LoRA，只跑 40 步量峰值。
# 確認 GB10 統一記憶體吃得下之後再換 lora_novel_full.yaml 上全量。
pretrained_path: /app/checkpoints/ft-mixed-lr2e5-avgE-e12run-0820
train_manifest: /app/dataset/manifests/lora_novel_train.jsonl
val_manifest: /app/dataset/manifests/lora_novel_val.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 2
num_workers: 2
num_iters: 40
log_interval: 5
valid_interval: 20
save_interval: 40
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 8
max_steps: 40
max_batch_tokens: 4096
max_grad_norm: 1.0
save_path: /app/checkpoints/lora-novel-probe
tensorboard: /app/checkpoints/lora-novel-probe/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
