# 剔除時間軸錯位資料後重訓（對照 lora_novel_e4.yaml）。
# ep255/257/259 的錯位區段共 270 筆已從 manifest 移除 —— 那些切片的
# 語音內容與逐字稿對不上，是純雜訊。
# novel_only 全量 LoRA：補 ft-mixed-*-0820 缺的生字與專有名詞
# （倌／刃／劊… 24 個 strict 生字 + 刀疤老五／桃花窟… 1357 個詞）。
# 底模已收斂，LoRA 用比全參微調略高的 lr 但仍保守，避免洗掉既有音色。
pretrained_path: /app/checkpoints/ft-mixed-lr2e5-avgE-e12run-0820
train_manifest: /app/dataset/manifests/lora_novel_train.jsonl
val_manifest: /app/dataset/manifests/lora_novel_val.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 2
num_workers: 4
# 只有 1.76 h 資料，epoch 開太多會過擬合到這批語者的音色；
# 每 epoch 存檔 + 每 epoch 兩次 val，之後挑 val 最低的那個 checkpoint。
num_epochs: 4
valid_per_epoch: 2
save_per_epoch: 1
log_interval: 20
learning_rate: 0.00005
weight_decay: 0.01
warmup_steps: 100
max_batch_tokens: 4096
max_grad_norm: 1.0
save_path: /app/checkpoints/lora-novel-e4-clean
tensorboard: /app/checkpoints/lora-novel-e4-clean/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.05
