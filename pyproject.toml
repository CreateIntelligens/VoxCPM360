[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcpm"
dynamic = ["version"]
description = "VoxCPM: Tokenizer-Free TTS for Context-Aware Speech Generation and True-to-Life Voice Cloning"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "OpenBMB", email = "openbmb@gmail.com"}
]
maintainers = [
    {name = "OpenBMB", email = "openbmb@gmail.com"}
]
keywords = ["voxcpm", "text-to-speech", "tts", "speech-synthesis", "voice-cloning", "ai", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchcodec",
    "transformers>=4.45,<6",
    "einops",
    "inflect",
    "addict",
    "wetext",
    "modelscope>=1.22.0",
    "datasets>=3,<6",
    "huggingface-hub",
    "pydantic",
    # api.py 直接用到；以前由 gradio 間接帶進來，拿掉 gradio 後要自己列
    "fastapi>=0.142.2",
    "starlette>=1.7.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.37.0",
    "tqdm",
    "simplejson",
    "sortedcontainers",
    "soundfile",
    "soxr",
    "librosa",
    "matplotlib",
    "argbind",
    "safetensors",
    "speechbrain",
    # scripts/train_voxcpm_finetune.py 用；以前由 funasr 間接帶進來
    "tensorboardX",
    # 安全下限：傳遞依賴的修正版靠這裡設下限，再 `uv lock` 進 uv.lock。
    # 映像依 uv.lock 安裝（見 Dockerfile 應用層），只改 uv.lock 的 PR 也會生效。
    "certifi>=2026.10.23",
    "brotli>=1.2.1",
    "pillow>=13.0.0",
    "filelock>=4.2.4",
    "setuptools>=84.1.0",
    # 2026-11：CVE-2026-126360，fastapi 帶進來的傳遞依賴
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
# 推論服務專用：只在 Linux + CUDA 可用，且 pyproject 其餘部分是上游 OpenBMB 的
# 套件定義，不該把它放進一般依賴。獨立成 extra 才會連同依賴一起進 uv.lock。
serve = [
    "nano-vllm-voxcpm==2.0.4; sys_platform == 'linux'",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]
dev = [
    "voxcpm[test]",
    "black>=21.0",
    "flake8>=3.8",
    "pre-commit>=2.0",
]

[project.scripts]
voxcpm = "voxcpm.cli:main"

[project.urls]
Homepage = "https://github.com/OpenBMB/VoxCPM"
Repository = "https://github.com/OpenBMB/VoxCPM.git"
Documentation = "https://github.com/OpenBMB/VoxCPM#readme"
"Bug Tracker" = "https://github.com/OpenBMB/VoxCPM/issues"

[tool.uv]
# lock 要對著映像實際的 torch 版本解（Dockerfile 的 TORCH_VERSION／TORCHAUDIO_VERSION），
# 否則 torchcodec 這類和 torch 有 ABI 相依的套件會挑到對不上的版本。
# torchcodec 另行釘住：它的 wheel 只在 .so 裡綁 torch ABI、metadata 沒宣告，uv 看不出
# 來，而 lock 預設保留舊版（0.10.0 沒有 aarch64 wheel）。0.17.0 是映像實測可用的版本。
# 用 constraint 而非 override：只收窄解析範圍，不改寫套件自己宣告的需求。
# 映像不從 lock 安裝 torch 這一串（Dockerfile 排除），改 build args 時這裡要同步。
constraint-dependencies = [
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchcodec==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["voxcpm*", "bluemagpie*", "barbet*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
bluemagpie = ["LICENSE"]
barbet = ["LICENSE"]
"bluemagpie._vendor.voxcpm" = ["LICENSE", "PROVENANCE.md"]

[tool.setuptools_scm]
version_scheme = "post-release"
# Wheel-cache tags are not package versions; select only release-style tags.
git_describe_command = "git describe --dirty --tags --long --match [0-9]* --match v[0-9]*"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
