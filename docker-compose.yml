x-memory-guardrails: &memory-guardrails
  mem_limit: 64g
  memswap_limit: 64g
  oom_score_adj: 500

services:
  app:
    <<: *memory-guardrails
    build:
      context: .
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
        # 預設編入三代 GPU 架構（Ampere/Hopper/Blackwell），同一顆 image
        # 各機器通用。單機快速迭代時可用 .env 或環境變數縮成單一架構
        # （如 TORCH_ARCH_LIST=8.6），編譯時間約降為 1/3。
        TORCH_ARCH_LIST: ${TORCH_ARCH_LIST:-8.6;9.0;12.0}
        # 三者必須同時改，混搭會在執行期缺 libcudart。
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04}
        TORCH_CUDA_VARIANT: ${TORCH_CUDA_VARIANT:-cu130}
        FLASH_ATTN_VERSION: ${FLASH_ATTN_VERSION:-2.8.3}
        TORCH_VERSION: ${TORCH_VERSION:-2.13.0}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION:-2.11.0}
    image: voxcpm360-app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: voxcpm_app
    restart: unless-stopped
    environment:
      # Inject environment variables from .env
      - VOXCPM_DEVICE=${VOXCPM_DEVICE:-auto}
      - MODEL_ID=${MODEL_ID:-openbmb/VoxCPM2}
      - VOXCPM_OPTIMIZE=${VOXCPM_OPTIMIZE:-false}
      - VOXCPM_GPU_MEMORY_UTILIZATION=${VOXCPM_GPU_MEMORY_UTILIZATION:-0.35}
      - VOXCPM_PRELOAD=${VOXCPM_PRELOAD:-true}
      # One GB10 GPU is shared by both engines. Keep one active job, allow at
      # most two waiters, and fail queued requests explicitly instead of
      # leaving HTTP connections hanging until nginx's 900-second timeout.
      - VOXCPM_MAX_PENDING_SYNTHESIS=${VOXCPM_MAX_PENDING_SYNTHESIS:-2}
      - VOXCPM_QUEUE_TIMEOUT_SECONDS=${VOXCPM_QUEUE_TIMEOUT_SECONDS:-120}
      - VOXCPM_INTERACTIVE_BATCH_MAX=${VOXCPM_INTERACTIVE_BATCH_MAX:-4}
      # 併發 session 總量池（批次與串流共搶）。loop 執行緒化已完成，
      # 兩台 prod 實際跑 16（.env 覆寫）；預設 1 僅為新機器的保守起點。
      - VOXCPM_ENGINE_CONCURRENCY=${VOXCPM_ENGINE_CONCURRENCY:-1}
      # Match the upstream VoxCPM bad-case guard: cap audio generation relative
      # to target text length so a missed EOS cannot always run to 2000 tokens.
      # voxcpm2 的 diffusion 步數只能在引擎建構時設定（per-request 參數
      # 不生效），這裡是唯一真正的控制點。
      - VOXCPM_INFERENCE_TIMESTEPS=${VOXCPM_INFERENCE_TIMESTEPS:-10}
      - VOXCPM_MAX_GENERATE_LENGTH=${VOXCPM_MAX_GENERATE_LENGTH:-2000}
      - VOXCPM_MAX_AUDIO_TEXT_RATIO=${VOXCPM_MAX_AUDIO_TEXT_RATIO:-6.0}
      # Batch chunks are selected at runtime from CUDA and container memory
      # headroom. These values are portable safety ceilings, not GB10-specific.
      - VOXCPM_BATCH_MAX_CONCURRENCY=${VOXCPM_BATCH_MAX_CONCURRENCY:-16}
      - VOXCPM_BATCH_MEMORY_RESERVE_GIB=${VOXCPM_BATCH_MEMORY_RESERVE_GIB:-2.0}
      - VOXCPM_BATCH_MEMORY_PER_ITEM_GIB=${VOXCPM_BATCH_MEMORY_PER_ITEM_GIB:-1.5}
      - VOXCPM_BATCH_MEMORY_MIN_PER_ITEM_GIB=${VOXCPM_BATCH_MEMORY_MIN_PER_ITEM_GIB:-0.5}
      - VOXCPM_LORA_ROOTS=/app/models/native:/app/checkpoints
      - VOXCPM_FULL_MODEL_ROOTS=/app/models/native:/app/checkpoints
      - VOXCPM_BARBET_MODEL_ROOTS=/app/models/barbet
      # Bearer token for the CastAgent-compatible /api/v1/tts/* endpoints.
      # Blank disables auth (local development only).
      - TTS_API_KEY=${TTS_API_KEY:-}
      # cu130 的 nvrtc 原生支援 sm_121；退回 cu128 棧時 GB10 需設 0。
      - PYTORCH_JIT=${PYTORCH_JIT:-1}
      # 無值形式：.env 有設才注入容器（cuBLAS 只接受 :4096:8/:16:8，
      # 用 ${VAR:-} 會讓沒設的機器拿到空字串＝無效設定）。
      # 用途：強制 cuBLAS 確定性演算法（GB10 seed 決定性調查）。
      - CUBLAS_WORKSPACE_CONFIG
    # Pre-download models first, then start the unified API plus legacy Gradio.
    command: bash -c "python scripts/download_models.py --model-id ${MODEL_ID:-openbmb/VoxCPM2} && python api.py --port 8000"
    volumes:
      # Persistent cache for downloaded model weights (highly recommended to save GBs of downloading)
      - hf_cache:/home/voxcpm/.cache/huggingface
      - modelscope_cache:/home/voxcpm/.cache/modelscope
      # Optional: mount workspace directory for live edits (uncomment if developing)
      - .:/app
    
    # --- GPU CONFIGURATION ---
    # Enabled NVIDIA GPUs for container usage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  train:
    <<: *memory-guardrails
    image: voxcpm360-app
    profiles: [training]
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    stop_grace_period: 30s
    working_dir: /app
    environment:
      - PYTORCH_JIT=0
      - TOKENIZERS_PARALLELISM=false
    command:
      - python
      - scripts/train_voxcpm_finetune.py
      - --config_path
      - ${TRAIN_CONFIG_PATH:-conf/voxcpm_v2/trial_lora_20epochs.yaml}
    volumes:
      - hf_cache:/home/voxcpm/.cache/huggingface
      - modelscope_cache:/home/voxcpm/.cache/modelscope
      - .:/app
      - /mnt/nas:/mnt/nas:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: voxcpm360-web
    container_name: voxcpm_nginx
    restart: unless-stopped
    ports:
      # Map host's custom PORT to Nginx's container port PORT (dynamic)
      - "${PORT:-8800}:${PORT:-8800}"
    environment:
      - PORT=${PORT:-8800}
      # Restrict envsubst to ONLY replace PORT, preserving standard Nginx vars ($host, etc.)
      - NGINX_ENVSUBST_FILTER=PORT
    depends_on:
      - app

volumes:
  hf_cache:
    name: voxcpm_hf_cache
  modelscope_cache:
    name: voxcpm_modelscope_cache
